[workspace]
members = ["crates/*", "games/*", "xtask"]
exclude = ["compat-check"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["default_app", "std", "multi_threaded", "keyboard", "mouse", "gamepad", "debug"] }
avian2d = { version = "=0.8.0", default-features = false, features = ["2d", "parry-f32", "parallel"] }
leafwing-input-manager = { version = "=0.22.0", default-features = false, features = ["asset", "keyboard", "mouse"] }
bevy_asset_loader = "=0.28.1"
bevy-inspector-egui = { version = "=0.38.0", default-features = false, features = ["2d"] }
engine_core = { path = "crates/engine_core" }
dev_diagnostics = { path = "crates/dev_diagnostics" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.23"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0
